<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dakshya Jobs – Every Talent Deserves an Opportunity</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Public+Sans:wght@400;600&display=swap">
<style>
:root{--navy:#06265f;--gold:#fbb81e;--ink:#10203f;--paper:#fafaf7;--line:#d9d6cc;--mute:#586074}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 "Public Sans",system-ui,sans-serif;color:var(--ink);background:var(--paper)}
h1,h2,h3{font-family:"Bricolage Grotesque",Georgia,sans-serif;line-height:1.1;margin:0 0 .5em;color:var(--navy)}
h1{font-size:clamp(2.2rem,5.5vw,4rem);font-weight:800;max-width:16ch}h2{font-size:clamp(1.6rem,3.5vw,2.3rem)}
p{max-width:68ch}a{color:var(--navy)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.4rem;padding:.6rem 5vw;border-bottom:4px solid var(--gold);background:#fff;position:sticky;top:0;z-index:5}
header img{height:42px;display:block}
nav{display:flex;flex-wrap:wrap;gap:.2rem 1.1rem}
nav a{text-decoration:none;color:var(--ink);font-weight:600;padding:.2rem 0;border-bottom:3px solid transparent}
nav a:hover,nav a.on{border-color:var(--gold)}
main{padding:2.5rem 5vw 4rem;min-height:70vh}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem;margin:1.8rem 0}
.doors a{display:block;padding:1.3rem;background:var(--navy);color:#fff;text-decoration:none;border-radius:4px 22px 4px 4px}
.doors a:nth-child(2){background:var(--gold);color:var(--navy)}.doors a:nth-child(4){background:#fff;color:var(--navy);border:2px solid var(--navy)}
.doors b{display:block;font:800 1.3rem "Bricolage Grotesque",sans-serif}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem;margin:1rem 0}
.card{background:#fff;border:1px solid var(--line);border-top:4px solid var(--gold);padding:1rem;border-radius:3px}
.card h3{font-size:1.15rem;margin-bottom:.2em}.m{color:var(--mute);font-size:.9rem;margin:.2em 0}
.note{border-left:4px solid var(--gold);background:#fff6dc;padding:.8rem 1rem;max-width:760px;margin:1rem 0}
.pl{white-space:pre-line}
form{background:#fff;border:2px solid var(--navy);border-radius:4px 20px 4px 4px;padding:1.3rem;margin:1.2rem 0;max-width:860px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.9rem}.w{grid-column:1/-1}
label{font-weight:600;font-size:.9rem;display:block}
input,select,textarea{width:100%;font:inherit;padding:.5rem;margin-top:.25rem;border:1px solid #8b8f9a;border-radius:3px;background:#fff;color:var(--ink)}
.consent{font-weight:400;margin:1rem 0}.consent input{width:auto;margin:0 .4rem 0 0}
button{font:600 .95rem "Public Sans",sans-serif;background:var(--navy);color:#fff;border:0;padding:.65rem 1.3rem;border-radius:3px;cursor:pointer}
button.alt{background:#fff;color:var(--navy);border:2px solid var(--navy);padding:.3rem .8rem}
.msg{margin:.6rem 0 0;font-weight:600}.msg.ok{color:#0a6b2b}.msg.err{color:#b3261e}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.7rem;margin:1rem 0}
.stat{background:#fff;border:2px solid var(--navy);padding:.6rem;line-height:1.3}.stat b{display:block;font:800 1.7rem "Bricolage Grotesque",sans-serif}
.serial{font:800 1.1rem monospace;background:var(--navy);color:var(--gold);padding:.1rem .6rem;border-radius:3px}
.wrap{overflow-x:auto;margin:.6rem 0 1.4rem}table{border-collapse:collapse;width:100%;font-size:.88rem;background:#fff}
td,th{text-align:left;padding:.45rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--navy);color:#fff}
td select{width:auto;margin:0;padding:.2rem}
footer{border-top:4px solid var(--gold);padding:1.2rem 5vw;color:var(--mute);font-size:.9rem}
#pf{display:none}
@page{margin:14mm}
@media print{body>*:not(#pf){display:none!important}#pf{display:block;color:#000;font:12px/1.5 Arial,sans-serif}
#pf .ph{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--navy);padding-bottom:8px}#pf img{height:48px}
#pf .sr{margin:12px 0;font-size:15px;border:2px solid #000;padding:6px 10px;display:inline-block}
#pf table{font-size:12px}#pf th{background:#e8ecf5;color:#000;width:32%}#pf td,#pf th{border:1px solid #999}
#pf ol{padding-left:18px}#pf .sg{display:flex;justify-content:space-between;margin-top:50px}#pf .sg span{border-top:1px solid #000;padding-top:4px;width:40%;text-align:center}}
</style>
</head>
<body>
<header>
  <a href="#home"><img class="lg" alt="Dakshya Jobs"></a>
  <nav id="nav"><a href="#home">Home</a><a href="#jobs">Find Jobs</a><a href="#talent">Talent</a><a href="#quick">Quick Form</a><a href="#track">Track Form</a><a href="#login" id="navd">Login / Sign up</a></nav>
</header>
<main id="app"></main>

// ---------- API ----------
async function refresh(){try{const r=await fetch(U+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:K,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:S.rt})});const j=await r.json();if(!r.ok)return false;S.tok=j.access_token;S.rt=j.refresh_token;keep();return true}catch(x){return false}}
async function api(p,o={},again=1){
  const h=Object.assign({apikey:K,"Content-Type":"application/json"},S.tok?{Authorization:"Bearer "+S.tok}:{});
  const r=await fetch(U+p,Object.assign({},o,{headers:Object.assign(h,o.headers)}));
  if(r.status===401&&S.rt&&again){if(await refresh())return api(p,o,0);S={};keep()}
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.message||j.error_description||r.statusText)}
  return r.status===204?null:r.json().catch(()=>null);
}
async function auth(path,body){const r=await fetch(U+"/auth/v1/"+path,{method:"POST",headers:{apikey:K,"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||j.message||"Failed");return j}
async function loadP(){const r=await api("/rest/v1/profiles?id=eq."+S.uid);S.p=r&&r[0]||null}

// ---------- helpers ----------
function inp(n,l,t="text",o,v=""){
  const opt=t.endsWith("?"),r=opt?"":" required";t=t.replace("?","");const L=esc(l)+(opt?" (optional)":"");
  if(t==="select")return `<label>${L}<select name="${n}"${r}><option value="">Select…</option>${o.map(x=>`<option${x===v?" selected":""}>${esc(x)}</option>`).join("")}</select></label>`;
  if(t==="textarea")return `<label class="w">${L}<textarea name="${n}" rows="3"${r}>${esc(v)}</textarea></label>`;
  return `<label>${L}<input type="${t}" name="${n}" value="${esc(v)}"${r}></label>`;
}
const grid=(fs,v={})=>`<div class="g">${fs.map(([n,l,t,o])=>inp(n,l,t,o,v[n])).join("")}</div>`;
const tbl=(h,rows)=>`<div class="wrap"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
const stats=(...a)=>`<div class="stats">${a.map(([n,l])=>`<div class="stat"><b>${n}</b>${l}</div>`).join("")}</div>`;
const sel=(t,id,f,o,v)=>`<select data-t="${t}" data-id="${id}" data-f="${f}">${o.map(x=>`<option${x===v?" selected":""}>${x}</option>`).join("")}</select>`;
const dt=d=>new Date(d).toLocaleDateString();
const vcard=v=>`<article class="card"><h3>${esc(v.title)}</h3><p class="m">${esc(v.company)} · ${esc(v.location||"")} · ${esc(v.job_type||"")}</p><p>${esc(v.salary||"")}</p><button class="alt" data-v="${v.id}">View &amp; apply</button></article>`;
const tcard=t=>`<article class="card"><h3>${esc(t.name)}</h3><p class="m">${esc(t.headline||"")}</p><p><b>Skills:</b> ${esc(t.skills||"-")}</p><p class="m">${esc(t.location||"")} · ${esc(t.experience||"")} · ID ${esc(t.user_code)}</p></article>`;
const vform=()=>`<form id="vf"><h3>Post a vacancy</h3>${grid([["title","Job title"],["company","Company name"],["location","Location"],["job_type","Job type","select",["Full-time","Part-time","Contract","Internship"]],["salary","Salary (NPR)","text?"],["deadline","Last date to apply","date?"],["description","Job description","textarea"],["requirements","Requirements","textarea?"]],{company:S.p.org||""})}<p><button>Publish vacancy</button></p><p class="msg"></p></form>`;

function printForm(x){
  $("#pf").innerHTML=`<div class="ph"><img src="${LOGO}" alt=""><div style="text-align:right"><b style="font-size:15px">${x.kind==="seeker"?"JOB SEEKER FORM":"EMPLOYER FORM"}</b><br>Date: ${esc(x.date)}</div></div><div class="sr">Serial No: <b>${esc(x.serial)}</b></div><table>${Object.entries(x.data).map(([k,v])=>`<tr><th>${esc(k)}</th><td>${esc(v)||"&nbsp;"}</td></tr>`).join("")}</table><h3>Rules &amp; regulations</h3><ol>${RULES.map(r=>`<li>${r}</li>`).join("")}</ol><div class="sg"><span>Signature of ${x.kind==="seeker"?"applicant":"employer"}</span><span>Dakshya Jobs office</span></div><p style="text-align:center;margin-top:18px">Dakshya Jobs, Janakpur, Madhesh Province, Nepal</p>`;
  setTimeout(()=>print(),200);
}

  const v=V.find(x=>x.id==id);if(!v)return;
  api("/rest/v1/rpc/view_vacancy",{method:"POST",body:JSON.stringify({p_id:v.id})}).catch(()=>{});
  $("#jd").innerHTML=`<div class="note"><h3>${esc(v.title)}</h3><p class="m">${esc(v.company)} · ${esc(v.location||"")} · ${esc(v.job_type||"")} · ${esc(v.salary||"")}${v.deadline?" · Apply by "+esc(v.deadline):""}</p><p class="pl">${esc(v.description||"")}</p><p class="pl"><b>Requirements:</b> ${esc(v.requirements||"-")}</p><button data-apply="${v.id}">Apply for this job</button><p class="msg" id="am"></p></div>`;
  scrollTo(0,0);
}
R.talent=async()=>{
  T=await api("/rest/v1/talent_public");
  app.innerHTML=`<h2>Talent</h2><p>Profiles of job seekers who chose to be shown and were approved by our team. Employers who want to contact a candidate can quote the ID to Dakshya Jobs.</p><input id="ts" placeholder="Search by name, skill or location" aria-label="Search talent" style="max-width:420px"><div class="cards" id="tl"></div>`;listT();
};
const listT=()=>{const q=($("#ts").value||"").toLowerCase();$("#tl").innerHTML=T.filter(t=>[t.name,t.skills,t.headline,t.location].join(" ").toLowerCase().includes(q)).map(tcard).join("")||"<p>No profiles found.</p>"};
R.quick=async()=>{
  app.innerHTML=`<h2>Quick form — no sign-up needed</h2><p>Fill in the form to get a unique serial number. Print it or save it as a PDF to carry with you, and use the serial number to track your form.</p><label style="max-width:300px">I am a<select id="qk"><option value="seeker">Job seeker</option><option value="employer">Employer</option></select></label><form id="qf"></form><div id="qr"></div>`;drawQ("seeker");
};
const drawQ=k=>{const f=$("#qf");f.dataset.k=k;f.innerHTML=`<div class="g">${Q[k].map(([l,t,o])=>inp(l,l,t,o)).join("")}</div><label class="consent"><input type="checkbox" required>I confirm the details are true and I consent to Dakshya Jobs using them for recruitment.</label><button>Submit form</button><p class="msg"></p>`};
R.track=async()=>{app.innerHTML=`<h2>Track your form</h2><form id="tf" style="max-width:420px">${inp("serial","Serial number (example DJF-26-00001)")}<p><button>Check status</button></p></form><div id="tr"></div>`};
R.login=async()=>{
  const sg=MODE!=="in";
  app.innerHTML=`<h2>${sg?"Create your "+(MODE==="seeker"?"job seeker":"employer")+" account":"Log in"}</h2>
  <p><button class="alt" data-mode="in">Log in</button> <button class="alt" data-mode="seeker">Sign up as job seeker</button> <button class="alt" data-mode="employer">Sign up as employer</button></p>
  <form id="lf" style="max-width:560px">${sg?grid([["name",MODE==="employer"?"Contact person":"Full name"],["phone","Mobile number","tel"]].concat(MODE==="employer"?[["org","Company name"]]:[])):""}${grid([["email","Email","email"],["password","Password (at least 6 characters)","password"]])}<p><button>${sg?"Create account":"Log in"}</button></p><p class="msg"></p></form>${sg?"":`<p><a href="#forgot">Forgot password?</a></p>`}`;
};
R.forgot=async()=>{
  app.innerHTML=`<h2>Forgot password</h2>${ERR?`<p class="msg err">${esc(ERR)}</p>`:""}<p>Enter your account email. We will send you a code to set a new password.</p><form id="ff" style="max-width:460px">${grid([["email","Email","email"]])}<p><button>Send code</button></p><p class="msg"></p></form><p><a href="#login" data-mode="in">Back to log in</a></p>`;ERR="";
};
R.reset=async()=>{
  if(!RT)return go("forgot");
  app.innerHTML=`<h2>Set a new password</h2><form id="rf" style="max-width:460px">${grid([["password","New password (at least 6 characters)","password"],["password2","Repeat new password","password"]])}<p><button>Change password</button></p><p class="msg"></p></form>`;
};
R.dash=async()=>{
  if(!S.tok)return go("login");
  if(!S.p)await loadP();
  const p=S.p;if(!p){S={};keep();return go("login")}
  const head=`<h2>${esc(p.name||"Welcome")}</h2><p><span class="serial">${esc(p.user_code)}</span> · ${esc(p.role)} · <button class="alt" id="lo">Log out</button></p>`;
  if(p.role==="seeker")return seekerDash(head);
  if(p.role==="employer")return empDash(head);
  return admDash(head);
};
async function seekerDash(head){
  const a=await api("/rest/v1/applications?select=id,status,created_at,vacancies(title,company)&seeker_id=eq."+S.uid+"&order=created_at.desc"),p=S.p,n=s=>a.filter(x=>x.status===s).length;
  app.innerHTML=head+stats([a.length,"Total applied"],...STS.slice(1).map(s=>[n(s),s]))+`<h3>My applications</h3>`+
   (a.length?tbl(["Job","Company","Date","Status"],a.map(x=>[esc(x.vacancies&&x.vacancies.title),esc(x.vacancies&&x.vacancies.company),dt(x.created_at),`<b>${x.status}</b>`])):`<p>No applications yet. <a href="#jobs">Find jobs</a></p>`)+
   `<form id="pfm"><h3>My profile</h3>${grid([["name","Full name"],["phone","Mobile number","tel"],["headline","Headline (example: Accountant, 3 years)","text?"],["skills","Skills","text?"],["education","Education","select",EDU],["experience","Experience","select",EXP],["location","Location","text?"],["bio","About me","textarea?"]],p)}<label class="consent"><input type="checkbox" name="show_in_talent"${p.show_in_talent?" checked":""}>Show my profile in the public Talent section (name, headline, skills, education, experience, location). Needs admin approval. ${p.show_in_talent?(p.approved_talent?"<b>Status: visible.</b>":"<b>Status: waiting for approval.</b>"):""}</label><button>Save profile</button><p class="msg"></p></form>`;
}
async function empDash(head){
  const [vs,ap]=await Promise.all([api("/rest/v1/vacancies?employer_id=eq."+S.uid+"&order=created_at.desc"),api("/rest/v1/applications?select=id,status,vacancy_id,vacancies(title),profiles(user_code,name,phone,email,headline,skills,experience,education)&order=created_at.desc")]);
  const c=id=>ap.filter(a=>a.vacancy_id===id).length,n=s=>ap.filter(a=>a.status===s).length;
  app.innerHTML=head+stats([vs.length,"Vacancies"],[ap.length,"Applicants"],[n("Shortlisted"),"Shortlisted"],[n("Rejected"),"Rejected"],[n("Hired"),"Hired"])+vform()+`<h3>My vacancies</h3>`+
   tbl(["Title","Status","Views","Applicants"],vs.map(v=>[esc(v.title),sel("vacancies",v.id,"status",["open","closed","hidden"],v.status),v.views,c(v.id)]))+`<h3>Applicants</h3>`+
   tbl(["Job","Applicant","Contact","Profile","Status"],ap.map(a=>{const p=a.profiles||{};return[esc(a.vacancies&&a.vacancies.title),esc(p.name)+"<br>"+esc(p.user_code),esc(p.phone)+"<br>"+esc(p.email),esc([p.headline,p.skills,p.experience,p.education].filter(Boolean).join(" · ")),sel("applications",a.id,"status",STS,a.status)]}))+
   `<form id="pfm"><h3>Company profile</h3>${grid([["name","Contact person"],["phone","Mobile number","tel"],["org","Company name"]],S.p)}<button>Save</button><p class="msg"></p></form>`;
}
async function admDash(head){
  const [vs,pr,ap,qf]=await Promise.all([api("/rest/v1/vacancies?order=created_at.desc&limit=500"),api("/rest/v1/profiles?order=created_at.desc&limit=500"),api("/rest/v1/applications?select=id,status&limit=2000"),api("/rest/v1/quick_forms?order=created_at.desc&limit=500")]);
  QF=qf;let b="";
  if(TAB==="Overview")b=stats([pr.length,"Users"],[vs.length,"Vacancies"],[ap.length,"Applications"],[qf.length,"Quick forms"],...STS.map(s=>[ap.filter(a=>a.status===s).length,s]));
  if(TAB==="Vacancies")b=vform()+tbl(["Title","Company","Status","Views",""],vs.map(v=>[esc(v.title),esc(v.company),sel("vacancies",v.id,"status",["open","closed","hidden"],v.status),v.views,`<button class="alt" data-del="vacancies:${v.id}">Delete</button>`]));
  if(TAB==="Talent")b=`<p>Tick “Approved” to show a seeker in the public Talent section. Seekers must also have chosen to be shown.</p>`+tbl(["ID","Name","Headline / skills","Wants to be shown","Approved"],pr.filter(x=>x.role==="seeker").map(x=>[esc(x.user_code),esc(x.name),esc([x.headline,x.skills].filter(Boolean).join(" · ")),x.show_in_talent?"Yes":"No",`<input type="checkbox" data-t="profiles" data-id="${x.id}" data-f="approved_talent"${x.approved_talent?" checked":""}>`]));
  if(TAB==="Users")b=tbl(["ID","Name","Role","Email","Phone","Company"],pr.map(x=>[esc(x.user_code),esc(x.name),sel("profiles",x.id,"role",["seeker","employer","admin"],x.role),esc(x.email),esc(x.phone),esc(x.org)]));
  if(TAB==="Quick forms")b=tbl(["Serial","Type","Date","Details","Status",""],qf.map((x,i)=>[`<b>${esc(x.serial)}</b>`,x.kind,dt(x.created_at),esc(Object.values(x.data).slice(0,3).join(" · ")),sel("quick_forms",x.id,"status",["Received","Processing","Contacted","Registered","Closed"],x.status),`<button class="alt" data-pq="${i}">Print</button>`]));
  app.innerHTML=head+`<p>${["Overview","Vacancies","Talent","Users","Quick forms"].map(t=>`<button class="${t===TAB?"":"alt"}" data-tab="${t}">${t}</button>`).join(" ")}</p>`+b;
}

// ---------- routing ----------
async function show(id){
  if(!R[id])id="home";
  $("#navd").setAttribute("href",S.tok?"#dash":"#login");$("#navd").textContent=S.tok?"Dashboard":"Login / Sign up";
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+id));
  app.innerHTML="<p>Loading…</p>";
  try{await R[id]()}catch(x){app.innerHTML=`<p class="msg err">Something went wrong: ${esc(x.message)}</p>`}
  scrollTo(0,0);
}
const go=id=>{try{history.replaceState(null,"","#"+id)}catch(x){}return show(id)};
addEventListener("hashchange",()=>show((location.hash||"#home").slice(1)));

// ---------- events ----------
document.addEventListener("click",async e=>{
  const t=e.target,c=s=>t.closest&&t.closest(s);
  try{
    const a=c('a[href^="#"]');
    if(a){e.preventDefault();if(a.dataset.mode)MODE=a.dataset.mode;go(a.getAttribute("href").slice(1));return}
    let x;
    if((x=c("[data-v]"))){if($("#jd"))openJob(x.dataset.v);else{PEND=x.dataset.v;go("jobs")}return}
    if((x=c("[data-apply]"))){
      if(!S.tok){go("login");return}
      if(!S.p)await loadP();
      if(!S.p||S.p.role!=="seeker"){say($("#am"),"Only job seeker accounts can apply.");return}
      try{await api("/rest/v1/applications",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({vacancy_id:+x.dataset.apply,seeker_id:S.uid})});say($("#am"),"Applied. You can track it in your dashboard.",1)}
      catch(er){say($("#am"),/duplicate|unique/i.test(er.message)?"You have already applied for this job.":"Could not apply: "+er.message)}
      return}
    if((x=c("[data-mode]"))){MODE=x.dataset.mode;R.login();return}
    if((x=c("[data-tab]"))){TAB=x.dataset.tab;R.dash();return}
    if((x=c("[data-pq]"))){const q=x.dataset.pq==="last"?LAST:(r=>({serial:r.serial,kind:r.kind,data:r.data,date:dt(r.created_at)}))(QF[+x.dataset.pq]);printForm(q);return}
    if((x=c("[data-del]"))){const[tb,id]=x.dataset.del.split(":");if(confirm("Delete permanently?")){await api(`/rest/v1/${tb}?id=eq.${encodeURIComponent(id)}`,{method:"DELETE"});R.dash()}return}
    if(c("#lo")){S={};keep();go("home")}
  }catch(er){alert(er.message)}
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="qk")return drawQ(t.value);
  if(!(t.dataset&&t.dataset.t))return;
  try{await api(`/rest/v1/${t.dataset.t}?id=eq.${encodeURIComponent(t.dataset.id)}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({[t.dataset.f]:t.type==="checkbox"?t.checked:t.value})})}
  catch(er){alert("Could not save: "+er.message)}
});
document.addEventListener("input",e=>{if(e.target.id==="js")listJobs();if(e.target.id==="ts")listT()});
document.addEventListener("submit",async e=>{
  const f=e.target,m=f.querySelector(".msg"),d=Object.fromEntries(new FormData(f));e.preventDefault();
  try{
    if(f.id==="lf"){
      say(m,"Please wait…",1);let j;
      if(MODE==="in")j=await auth("token?grant_type=password",{email:d.email,password:d.password});
      else j=await auth("signup",{email:d.email,password:d.password,data:{role:MODE,name:d.name,phone:d.phone,org:d.org||""}});
      if(!j.access_token){say(m,"Account created. Check your email to confirm it, then log in.",1);return}
      S={tok:j.access_token,rt:j.refresh_token,uid:j.user.id};keep();await loadP();go("dash");
    }else if(f.id==="ff"){
      say(m,"Sending…",1);
      await auth("recover",{email:d.email});
      RE=d.email.trim();
      app.innerHTML=`<h2>Enter the code</h2><p>If this email is registered, we sent a code to <b>${esc(RE)}</b>. Check your inbox and spam folder.</p><form id="rf" style="max-width:460px">${grid([["code","Code from the email"],["password","New password (at least 6 characters)","password"],["password2","Repeat new password","password"]])}<p><button>Change password</button></p><p class="msg"></p></form><p><a href="#forgot">Send a new code</a></p>`;
    }else if(f.id==="rf"){
      if(d.password!==d.password2){say(m,"Passwords do not match.");return}
      let tk=RT;
      if(!tk){const v=await auth("verify",{type:"recovery",email:RE,token:String(d.code||"").trim()});tk=v.access_token}
      const r=await fetch(U+"/auth/v1/user",{method:"PUT",headers:{apikey:K,Authorization:"Bearer "+tk,"Content-Type":"application/json"},body:JSON.stringify({password:d.password})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(j.msg||j.message||j.error_description||"Could not change the password. The link may have expired. Request a new one.");
      RT=null;RE="";S={};keep();
      app.innerHTML=`<h2>Password changed</h2><p>You can now log in with your new password.</p><p><a href="#login" data-mode="in">Go to log in →</a></p>`;
    }else if(f.id==="qf"){
      const k=f.dataset.k,s=await api("/rest/v1/rpc/submit_quick_form",{method:"POST",body:JSON.stringify({p_kind:k,p_data:d})});
      LAST={serial:s,kind:k,data:d,date:dt(new Date())};
      $("#qr").innerHTML=`<div class="note"><b>Form submitted.</b> Your serial number: <span class="serial">${esc(s)}</span><br>Keep it to track your form.</div><p><button data-pq="last">Print / Save as PDF</button></p>`;
      f.reset();
    }else if(f.id==="tf"){
      const r=await api("/rest/v1/rpc/track_form",{method:"POST",body:JSON.stringify({p_serial:d.serial})});
      $("#tr").innerHTML=r&&r.length?`<div class="note"><b>${esc(d.serial.toUpperCase())}</b><br>Type: ${esc(r[0].kind)}<br>Submitted: ${dt(r[0].created_at)}<br>Status: <b>${esc(r[0].status)}</b></div>`:`<p class="msg err">No form found with this serial number.</p>`;
    }else if(f.id==="vf"){
      if(!d.deadline)delete d.deadline;d.employer_id=S.uid;
      await api("/rest/v1/vacancies",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(d)});R.dash();
    }else if(f.id==="pfm"){
      if(S.p.role==="seeker")d.show_in_talent=f.elements.show_in_talent.checked;
      await api("/rest/v1/profiles?id=eq."+S.uid,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify(d)});await loadP();say(m,"Saved.",1);
    }
  }catch(er){say(m,er.message)}
});

document.querySelectorAll(".lg").forEach(i=>i.src=LOGO);
// Password-reset links return here with the details in the address after #
const hp=new URLSearchParams(location.hash.slice(1));
let RT=null,RE="",ERR=hp.get("error_description")||"";
if(hp.get("type")==="recovery"&&hp.get("access_token")){RT=hp.get("access_token");try{history.replaceState(null,"",location.pathname+location.search)}catch(x){}}
show(RT?"reset":ERR?"forgot":(location.hash||"#home").slice(1));
</script>
