<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dakshya Jobs – Every Talent Deserves an Opportunity</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Public+Sans:wght@400;600&display=swap">
<style>
:root{--navy:#06265f;--gold:#fbb81e;--ink:#10203f;--paper:#fafaf7;--line:#d9d6cc;--mute:#586074}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 "Public Sans",system-ui,sans-serif;color:var(--ink);background:var(--paper)}
h1,h2,h3{font-family:"Bricolage Grotesque",Georgia,sans-serif;line-height:1.1;margin:0 0 .5em;color:var(--navy)}
h1{font-size:clamp(2.2rem,5.5vw,4rem);font-weight:800;max-width:16ch}h2{font-size:clamp(1.6rem,3.5vw,2.3rem)}
p{max-width:68ch}a{color:var(--navy)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.4rem;padding:.6rem 5vw;border-bottom:4px solid var(--gold);background:#fff;position:sticky;top:0;z-index:5}
header img{height:42px;display:block}
nav{display:flex;flex-wrap:wrap;gap:.2rem 1.1rem}
nav a{text-decoration:none;color:var(--ink);font-weight:600;padding:.2rem 0;border-bottom:3px solid transparent}
nav a:hover,nav a.on{border-color:var(--gold)}
main{padding:2.5rem 5vw 4rem;min-height:70vh}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem;margin:1.8rem 0}
.doors a{display:block;padding:1.3rem;background:var(--navy);color:#fff;text-decoration:none;border-radius:4px 22px 4px 4px}
.doors a:nth-child(2){background:var(--gold);color:var(--navy)}.doors a:nth-child(4){background:#fff;color:var(--navy);border:2px solid var(--navy)}
.doors b{display:block;font:800 1.3rem "Bricolage Grotesque",sans-serif}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem;margin:1rem 0}
.card{background:#fff;border:1px solid var(--line);border-top:4px solid var(--gold);padding:1rem;border-radius:3px}
.card h3{font-size:1.15rem;margin-bottom:.2em}.m{color:var(--mute);font-size:.9rem;margin:.2em 0}
.note{border-left:4px solid var(--gold);background:#fff6dc;padding:.8rem 1rem;max-width:760px;margin:1rem 0}
.pl{white-space:pre-line}
form{background:#fff;border:2px solid var(--navy);border-radius:4px 20px 4px 4px;padding:1.3rem;margin:1.2rem 0;max-width:860px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.9rem}.w{grid-column:1/-1}
label{font-weight:600;font-size:.9rem;display:block}
input,select,textarea{width:100%;font:inherit;padding:.5rem;margin-top:.25rem;border:1px solid #8b8f9a;border-radius:3px;background:#fff;color:var(--ink)}
.consent{font-weight:400;margin:1rem 0}.consent input{width:auto;margin:0 .4rem 0 0}
button{font:600 .95rem "Public Sans",sans-serif;background:var(--navy);color:#fff;border:0;padding:.65rem 1.3rem;border-radius:3px;cursor:pointer}
button.alt{background:#fff;color:var(--navy);border:2px solid var(--navy);padding:.3rem .8rem}
.msg{margin:.6rem 0 0;font-weight:600}.msg.ok{color:#0a6b2b}.msg.err{color:#b3261e}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.7rem;margin:1rem 0}
.stat{background:#fff;border:2px solid var(--navy);padding:.6rem;line-height:1.3}.stat b{display:block;font:800 1.7rem "Bricolage Grotesque",sans-serif}
.serial{font:800 1.1rem monospace;background:var(--navy);color:var(--gold);padding:.1rem .6rem;border-radius:3px}
.wrap{overflow-x:auto;margin:.6rem 0 1.4rem}table{border-collapse:collapse;width:100%;font-size:.88rem;background:#fff}
td,th{text-align:left;padding:.45rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--navy);color:#fff}
td select{width:auto;margin:0;padding:.2rem}
footer{border-top:4px solid var(--gold);padding:1.2rem 5vw;color:var(--mute);font-size:.9rem}
#pf{display:none}
@page{margin:14mm}
@media print{body>*:not(#pf){display:none!important}#pf{display:block;color:#000;font:12px/1.5 Arial,sans-serif}
#pf .ph{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--navy);padding-bottom:8px}#pf img{height:48px}
#pf .sr{margin:12px 0;font-size:15px;border:2px solid #000;padding:6px 10px;display:inline-block}
#pf table{font-size:12px}#pf th{background:#e8ecf5;color:#000;width:32%}#pf td,#pf th{border:1px solid #999}
#pf ol{padding-left:18px}#pf .sg{display:flex;justify-content:space-between;margin-top:50px}#pf .sg span{border-top:1px solid #000;padding-top:4px;width:40%;text-align:center}}
</style>
</head>
<body>
<header>
  <a href="#home"><img class="lg" alt="Dakshya Jobs"></a>
  <nav id="nav"><a href="#home">Home</a><a href="#jobs">Find Jobs</a><a href="#talent">Talent</a><a href="#quick">Quick Form</a><a href="#track">Track Form</a><a href="#login" id="navd">Login / Sign up</a></nav>
</header>
<main id="app"></main>
